name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: pyinstaller --noconfirm --onefile --windowed --name VAZ21124-IntakeCalc --icon icon.ico --add-data "ui;ui" app.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/VAZ21124-IntakeCalc.exe
          generate_release_notes: true
